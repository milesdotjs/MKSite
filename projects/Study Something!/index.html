<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Something!</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.base.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.brown.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/chessground@9.1.1/assets/chessground.cburnett.css">
</head>
<body>
    <div class="layout">
        <aside class="sidebar">
            <header class="sidebar-header">
                <h1>Study Something!</h1>
                <p class="subtitle">Random OTB games from top players</p>
            </header>

            <section class="controls">
                <div class="control-group">
                    <label for="player">Player</label>
                    <select id="player"></select>
                </div>

                <div class="control-group">
                    <label for="maxGames">Max Games to Sample</label>
                    <input type="number" id="maxGames" value="100" min="1" max="2000">
                </div>

                <button id="randomBtn" class="btn-primary">Random Game</button>
            </section>

            <section id="gameInfo" class="game-info empty">
                <p class="placeholder">No game selected yet.</p>
            </section>
        </aside>

        <main class="main">
            <section id="gameViewer" class="viewer empty">
                <p class="placeholder-large">Hit <strong>Random Game</strong> to load a game.</p>
            </section>
        </main>
    </div>

    <script type="importmap">
    {
        "imports": {
            "chess.js": "https://cdn.jsdelivr.net/npm/chess.js@1.0.0-beta.8/+esm",
            "chessground": "https://cdn.jsdelivr.net/npm/chessground@9.1.1/+esm"
        }
    }
    </script>
    <script type="module" src="script.js"></script>
</body>
</html>
