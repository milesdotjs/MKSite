<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>7-3 — art atlas</title>
    <style>
      body {
        margin: 0;
        background: #1b1b22;
        color: #cfcfe0;
        font: 13px/1.5 ui-monospace, Consolas, monospace;
        padding: 16px;
      }
      h2 {
        font-size: 11px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #8f8fb0;
        margin: 20px 0 8px;
      }
      canvas {
        image-rendering: pixelated;
        display: block;
        background: #000;
      }
    </style>
  </head>
  <body>
    <h2>font — full charset + specimens</h2>
    <canvas id="font"></canvas>

    <h2>tiles — 3&times;3 patches, office palette (* = task zone)</h2>
    <canvas id="tiles"></canvas>

    <h2>actors — down, up, right, left</h2>
    <canvas id="actors"></canvas>

    <h2>ui chrome — true 160&times;144</h2>
    <canvas id="chrome"></canvas>

    <h2>enemies — 44&times;44</h2>
    <canvas id="enemies"></canvas>

    <h2>palette sweep</h2>
    <canvas id="pals"></canvas>

    <script type="module" src="./atlas.js"></script>
  </body>
</html>
